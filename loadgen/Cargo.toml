[package]
name = "loadgen"
version = "0.1.0"
edition = "2024"
description = "Lightweight SSE streaming client for load-testing an OpenAI-compatible gateway"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1
